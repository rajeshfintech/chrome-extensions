<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tab Auto Grouper</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 300px;
      padding: 14px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 13px;
      color: #202124;
      background: #fff;
    }
    header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
      border-bottom: 1px solid #e8eaed;
      padding-bottom: 10px;
    }
    header img { width: 20px; height: 20px; }
    header h1 { font-size: 14px; font-weight: 600; flex: 1; }
    #loaded-label { font-size: 11px; color: #5f6368; }

    #groups { margin-bottom: 10px; max-height: 200px; overflow-y: auto; }
    .group-item {
      padding: 5px 8px;
      margin: 3px 0;
      border-radius: 4px;
      background: #f1f3f4;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .swatch { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
    .group-name { font-weight: 500; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .group-count { color: #5f6368; font-size: 11px; white-space: nowrap; }
    .empty { color: #9aa0a6; padding: 4px 0; font-size: 12px; }

    button {
      width: 100%;
      padding: 7px 12px;
      background: #1a73e8;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      white-space: nowrap;
    }
    button + button { margin-top: 6px; }
    button:hover { background: #1557b0; }
    button:disabled { background: #9aa0a6; cursor: default; color: #fff; border-color: transparent; }
    button.secondary { background: #fff; color: #1a73e8; border: 1px solid #dadce0; }
    button.secondary:hover { background: #f1f3f4; }

    .section-title {
      font-size: 11px;
      font-weight: 600;
      color: #5f6368;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      margin: 12px 0 6px;
      border-top: 1px solid #e8eaed;
      padding-top: 10px;
    }
    .add-row { display: flex; gap: 6px; }
    .add-row select {
      flex: 1;
      min-width: 0;
      padding: 6px 8px;
      border: 1px solid #dadce0;
      border-radius: 4px;
      font-size: 12px;
      background: #fff;
    }
    .add-row button { width: auto; flex-shrink: 0; font-size: 12px; padding: 6px 10px; }

    #manual-list { max-height: 120px; overflow-y: auto; margin-top: 6px; }
    .manual-item {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px 8px;
      margin: 3px 0;
      border-radius: 6px;
      background: #f8f9fa;
      border: 1px solid #e8eaed;
    }
    .manual-match { flex: 1; min-width: 0; font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .manual-group { font-size: 11px; color: #1a73e8; white-space: nowrap; }
    .remove-btn {
      width: auto;
      background: none;
      border: none;
      cursor: pointer;
      color: #9aa0a6;
      font-size: 14px;
      line-height: 1;
      padding: 2px 4px;
      flex-shrink: 0;
    }
    .remove-btn:hover { color: #dc2626; background: none; }

    #status { color: #5f6368; font-size: 11px; margin-top: 8px; text-align: center; }

    #reload-banner {
      margin-bottom: 10px;
      padding: 8px 10px;
      border-radius: 6px;
      background: #fef7e0;
      border: 1px solid #f9ab00;
      font-size: 12px;
      color: #202124;
    }
    #reload-banner[hidden] { display: none; }
    #reload-banner p { margin-bottom: 6px; }
  </style>
</head>
<body>
  <header>
    <img src="icons/icon48.png" alt="">
    <h1>Tab Auto Grouper</h1>
    <span id="loaded-label"></span>
  </header>

  <div id="reload-banner" hidden>
    <p>The extension was updated but Chrome is still running the old background code.</p>
    <button id="selfReloadBtn">Reload extension</button>
  </div>
  <div id="groups"><div class="empty">Loading…</div></div>

  <button id="groupAllBtn">Group all open tabs</button>
  <button id="reloadBtn" class="secondary">Reload Config</button>
  <button id="collapseBtn" class="secondary">Collapse All</button>

  <div class="section-title">Add current site to group</div>
  <div class="add-row">
    <select id="groupSelect"></select>
    <button id="addCurrentBtn">Add</button>
  </div>
  <div id="manual-list"><div class="empty">No rules added from the popup</div></div>

  <div class="section-title">Export</div>
  <button id="snapshotBtn" class="secondary">Copy current groups as YAML</button>

  <div id="status"></div>

  <script type="module" src="popup.js"></script>
</body>
</html>
