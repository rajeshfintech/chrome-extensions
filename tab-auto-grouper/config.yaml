# Tab Auto Grouper — configuration
# Edit this file, then run:  tabgroups sync
#
# Colors: grey | blue | red | yellow | green | pink | purple | cyan | orange
# (These 9 are the only colors Chrome's tab-group API supports — others are
#  rejected by the browser and fall back to grey.)
#
# Rule types (used in both `groups` and `exclude`), one key per rule:
#   domain:  hostname and all subdomains     (github.com → github.com, api.github.com)
#   path:    hostname + path prefix          (docs.google.com/spreadsheets)
#   pattern: case-insensitive regex on the full URL   ("^https://[^/]+\\.okta\\.com/")
#   title:   case-insensitive substring of the tab title   ("[JIRA]")
#
# When several rules match, the LONGEST matching rule wins, so
# `domain: gemini.google.com` beats `domain: google.com` wherever each lives.
# Give a group `priority: 10` to make its rules win regardless of length.

version: 1

# Arrange managed groups left-to-right in the order below whenever a bulk pass
# runs ("Group all open tabs", "Reload Config", config change, browser start).
sort_groups: true

# When a NEW tab lands on a URL already open in the same window, focus the
# existing tab and close the new one. Only brand-new tabs are affected.
dedupe_tabs: false

# Tabs matching ANY rule here are never grouped, regardless of `groups` below.
exclude: []
# exclude:
#   - domain: example.com
#   - path: docs.google.com/spreadsheets/d/my-specific-sheet

groups:
  - name: "Work"
    color: blue
    collapsed: false
    rules:
      - domain: github.com
      - domain: gitlab.com
      - domain: jira.atlassian.net
      - domain: confluence.atlassian.net
      - domain: linear.app

  - name: "Google"
    color: red
    collapsed: false
    rules:
      - domain: google.com        # covers mail, calendar, drive, docs, ...
      - domain: gmail.com

  - name: "Social"
    color: pink
    collapsed: false
    rules:
      - domain: twitter.com
      - domain: x.com
      - domain: linkedin.com
      - domain: reddit.com

  - name: "Shopping"
    color: yellow
    collapsed: true
    rules:
      - domain: amazon.com
      - domain: ebay.com

  - name: "AI"
    color: purple
    collapsed: false
    rules:
      - domain: claude.ai
      - domain: chat.openai.com
      - domain: chatgpt.com
      - domain: gemini.google.com   # longer than google.com above, so it wins
      - domain: perplexity.ai
